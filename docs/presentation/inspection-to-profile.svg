<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
<title id="title">Camwright: save the failed check, export the checked curve</title>
<desc id="desc">Actual 20/5 mm cam fails pressure at cam angle 60 degrees, yet its inspection can be saved. All 9 radius pairs classify 3 Fail and 6 Pass; 25/4 mm has minimum 29 mm zero-lift pitch radius within this grid. All 261 emitted vertices of each physical and pitch curve and the 4 mm roller at zero angle are drawn at equal scale. Model bounds do not establish machining fitness.</desc>
