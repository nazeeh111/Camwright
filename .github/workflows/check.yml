name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m venv .installed
      - run: .installed/bin/python -m pip install --no-index --no-deps dist/*.whl
      - run: .installed/bin/python -I tests/installed_smoke.py
