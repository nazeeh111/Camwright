[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camwright"
version = "0.2.0"
description = "Local roller-cam geometry checks and bounded profile export"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
camwright = "camwright.__main__:main"

[tool.setuptools]
packages = ["camwright"]
include-package-data = false

[tool.setuptools.package-data]
camwright = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg", "examples/*.json"]
